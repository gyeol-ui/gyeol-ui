name: CI

on:
  # PR 제목 검사는 pr-title.yml이 따로 돌린다. 제목만 고쳤을 때 이 검사를 다시 돌리지 않기 위해서다
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # main push는 커밋마다 검사를 끝까지 돌린다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 버전은 package.json의 packageManager에서 읽는다
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # turbo 원격 캐시 대신 로컬 캐시(.turbo/cache)를 Actions 캐시에 보관한다
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # 검사 목록은 루트 package.json의 check 스크립트가 정한다.
      # 패키지가 lint, typecheck, test, build 스크립트를 두면 자동으로 포함되고,
      # 새 종류의 검사는 turbo.json의 task와 check 스크립트에 추가한다.
      - run: pnpm check
